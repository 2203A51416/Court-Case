{% extends "base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}

<style>
  .register-card {
    max-width: 500px;
    margin: 80px auto;
    padding: 30px;
    background: rgba(0,0,0,0.65);
    color: white;
    border-radius: 12px;
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .role-box {
    text-align: center;
    margin-top: 40px;
  }

  .role-btn {
    padding: 15px 40px;
    margin: 15px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    background: #d4af37;
    color: black;
  }

  .form-group {
    margin-bottom: 15px;
  }

  label {
    display: block;
    margin-bottom: 5px;
  }

  input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
  }

  .hidden {
    display: none;
  }

  .btn-register {
    width: 100%;
    padding: 12px;
    background: #d4af37;
    border: none;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
  }
</style>

<div class="register-card">

  <!-- STEP 1 : ROLE SELECTION -->
  <div id="role-selection">
    <h2>Register As</h2>

    <div class="role-box">
      <button type="button" class="role-btn" onclick="showLawyerForm()">Lawyer</button>
      <button type="button" class="role-btn" onclick="showClientForm()">Client</button>
    </div>
  </div>

  <!-- ================= LAWYER FORM ================= -->
  <div id="lawyer-form" class="hidden">
    <h2>Lawyer Registration</h2>

    <form method="post" action="{% url 'register' %}">
      {% csrf_token %}
      <input type="hidden" name="role" value="LAWYER">

      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required>
      </div>

      <div class="form-group">
        <label>State Bar Council</label>
        <input type="text" name="state_bar" required>
      </div>

      <div class="form-group">
        <label>Enrollment Number</label>
        <input type="text" name="enrollment_no" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>
      </div>

      <button class="btn-register">Register</button>
    </form>
  </div>

  <!-- ================= CLIENT FORM ================= -->
  <div id="client-form" class="hidden">
    <h2>Client Registration</h2>

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="role" value="CLIENT">

      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" required>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea name="address" required></textarea>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>
      </div>

      <button class="btn-register">Register</button>
    </form>
  </div>

</div>

<script>
  function showLawyerForm() {
    document.getElementById("role-selection").style.display = "none";
    document.getElementById("lawyer-form").classList.remove("hidden");
  }

  function showClientForm() {
    document.getElementById("role-selection").style.display = "none";
    document.getElementById("client-form").classList.remove("hidden");
  }
</script>

{% endblock %}
